<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <title>Storyroom</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/docx@9.8.1/build/index.umd.cjs"></script>
</head>
<body class="theme-light">
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <header id="app-header" class="app-header">
    <div class="header-left">
      <span id="header-context-label" class="header-context-label">Storyroom</span>
      <h1 id="header-title" class="header-title">Desk</h1>
    </div>
    <div class="header-actions" id="header-actions"></div>
  </header>

  <main id="view-container" class="view-container"></main>

  <nav id="bottom-tabs" class="bottom-tabs">
    <button class="tab-btn active" data-view="home">
      <svg class="tab-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>Desk</span>
    </button>
    <button class="tab-btn" data-view="projects">
      <svg class="tab-icon" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      <span>Stories</span>
    </button>
    <button class="tab-btn" data-view="incubator">
      <svg class="tab-icon" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7zM9 21a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-1H9v1z"/></svg>
      <span>Incubator</span>
    </button>
    <button class="tab-btn" data-view="reader">
      <svg class="tab-icon" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      <span>Reader</span>
    </button>
    <button class="tab-btn" data-view="library">
      <svg class="tab-icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>Library</span>
    </button>
  </nav>

  <div id="modal-container" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-sheet" id="modal-content"></div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/continuity.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/reader.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
